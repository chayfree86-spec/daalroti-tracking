    <!-- Runtime config: edit app-config.js on the server to change the API URL
         without rebuilding (e.g. on Hostinger). Loaded before the app. -->
    <script src="./app-config.js"></script>
    <script>
      // ═══════════════════════════════════════════════════════════════
      // AUTO CACHE BUSTER — runs BEFORE any JS module loads.
      // On every new build Vite injects a fresh BUILD_TS into dist/index.html.
      // If it differs from localStorage, nuke all SW caches and reload.
      // ═══════════════════════════════════════════════════════════════
      (function() {
        var BUILD_TS = '__BUILD_TIMESTAMP__';
        var KEY = 'daalroti_build_ts';
        try {
          var stored = localStorage.getItem(KEY);
          // First visit — just store
          if (!stored) { localStorage.setItem(KEY, BUILD_TS); }
          // Version mismatch — clear everything & reload
          else if (stored !== BUILD_TS) {
            localStorage.setItem(KEY, BUILD_TS);
            // 1. Unregister all service workers
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            // 2. Clear all CacheStorage
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            // 3. Hard reload after a brief delay for async cleanup
            setTimeout(function() { location.reload(); }, 200);
          }
        } catch(e) {}

        // Theme bootstrap — apply dark class before paint to avoid flash
        try {
          var theme = localStorage.getItem('daalroti_theme') || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Bm6E0-nS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DCGNxru9.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="root"></div>

    <!-- Chay Chaupal Back to POS Admin Bridge -->
    <script>
      (function() {
        function mountBackBtn() {
          try {
            var params = new URLSearchParams(window.location.search);
            var isFromPos = params.get('from') === 'pos_admin' || (window.opener && !window.opener.closed);
            if (!isFromPos || document.getElementById('cc-return-to-pos-btn')) return;

            var btn = document.createElement('button');
            btn.id = 'cc-return-to-pos-btn';
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Return to POS Admin');
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px;"><polyline points="15 18 9 12 15 6"></polyline></svg><span>Back to POS Admin</span>';
            btn.setAttribute('style', [
              'position: fixed',
              'top: 12px',
              'right: 14px',
              'z-index: 9999999',
              'display: inline-flex',
              'align-items: center',
              'justify-content: center',
              'background: #061426',
              'color: #20B45A',
              'border: 1.5px solid #20B45A',
              'border-radius: 9999px',
              'padding: 7px 15px',
              'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
              'font-size: 12px',
              'font-weight: 700',
              'box-shadow: 0 4px 20px rgba(0,0,0,0.6)',
              'cursor: pointer',
              'transition: all 0.2s ease',
              'outline: none'
            ].join('; '));

            btn.onmouseover = function() {
              btn.style.background = '#20B45A';
              btn.style.color = '#FFFFFF';
            };
            btn.onmouseout = function() {
              btn.style.background = '#061426';
              btn.style.color = '#20B45A';
            };

            btn.onclick = function(e) {
              e.preventDefault();
              if (window.opener && !window.opener.closed) {
                try { window.opener.focus(); } catch(err) {}
                window.close();
              } else {
                var ret = params.get('return_url');
                if (ret) {
                  window.location.href = decodeURIComponent(ret);
                } else {
                  window.history.back();
                }
              }
            };

            document.body.appendChild(btn);
          } catch(e) {}
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mountBackBtn);
        } else {
          mountBackBtn();
        }
      })();
    </script>
  </body>
</html>
